name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Legal hold gate tests
        run: node --test tests/legal-gate.test.js

      # Required before the Pages artifact. Not inside a retry loop.
      # There is no skip input. A failure must not upload the site.
      - name: Pre-publish legal hold gate
        run: node scripts/legal-gate.js

      - name: Save hold queue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hold-queue
          path: hold-queue.jsonl
          if-no-files-found: ignore

      - name: Site audit
        run: node scripts/audit-site.js

      - name: Stage published site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude '_site/' \
            --exclude 'hold-queue.jsonl' \
            ./ _site/
          test ! -e _site/tests
          test ! -e _site/tests/fixtures/legal-gate/hold/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
